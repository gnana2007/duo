<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TimeSensei — Your Temporal Capture</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 28, 0.88);
      --crimson: #c51b2f;
      --crimson-grad: linear-gradient(135deg, #e52d3d 0%, #a01424 100%);
      --whatsapp: #25D366;
      --text: #f4f2eb;
      --text-muted: #8d95a5;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1f1822 0%, #090a0f 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(197, 27, 47, 0.18);
      color: #ff4d61;
      border: 1px solid rgba(197, 27, 47, 0.4);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .photo-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      margin-bottom: 24px;
    }
    .img-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .photo-info {
      font-size: 13px;
      color: var(--text-muted);
    }
    .photo-info strong {
      display: block;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 2px;
    }
    .actions {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-download {
      background: var(--crimson-grad);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(197, 27, 47, 0.4);
    }
    .btn-whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.10);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #656d80;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="/assets/watermark.png" alt="EXPO 2026" style="width: 72px; height: 72px; margin-bottom: 10px; filter: drop-shadow(0 4px 16px rgba(0, 180, 255, 0.45));">
    <div class="badge">Temporal Capture</div>
    <h1>TimeSensei</h1>
    <p class="subtitle">EXPO 2026 • Control Your Timeline</p>
  </div>

  <div class="photo-card">
    <div class="img-container">
      <img src="/image/{{ photo_id }}" alt="TimeSensei Temporal Capture" id="temporalPhoto">
    </div>
    <div class="card-body">
      <div class="photo-info">
        <strong>Temporal Echo</strong>
        <span>{{ photo_id }}</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <!-- Download to Phone -->
    <a href="/download/{{ photo_id }}" class="btn btn-download" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Save Photo to Phone
    </a>

    <!-- Direct WhatsApp Share -->
    <a href="#" id="whatsappBtn" class="btn btn-whatsapp" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.585 1.961.897 3.003.897 3.18 0 5.767-2.586 5.768-5.766.001-3.181-2.586-5.768-5.77-5.768zm3.287 8.243c-.144.405-.838.774-1.17.828-.311.05-.705.08-2.072-.487-1.579-.654-2.583-2.28-2.66-2.385-.078-.105-.639-.851-.639-1.624 0-.773.405-1.153.549-1.309.144-.156.315-.195.421-.195.105 0 .21.001.303.006.098.005.23-.037.36.275.144.346.49 1.196.533 1.283.043.088.072.19.014.304-.058.115-.087.186-.173.287-.086.101-.182.226-.26.303-.087.087-.177.182-.076.356.101.173.449.741.963 1.199.662.59 1.22.773 1.393.859.173.086.275.072.376-.043.101-.115.433-.505.549-.679.115-.173.231-.144.39-.086.159.058 1.011.477 1.184.563.173.087.289.13.332.203.043.072.043.419-.101.824z"/>
      </svg>
      Share to WhatsApp
    </a>

    <!-- Native Web Share if available -->
    <button id="nativeShareBtn" class="btn btn-share" style="display: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
      More Options
    </button>
  </div>

  <div class="footer">
    Captured with TimeSensei • Control Your Timeline
  </div>

  <script>
    const currentUrl = window.location.href;
    const shareText = "Check out my temporal capture from TimeSensei: Control Your Timeline! " + currentUrl;
    
    // Configure WhatsApp URL
    const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
    document.getElementById("whatsappBtn").href = waUrl;

    // Show native share if supported
    if (navigator.share) {
      const shareBtn = document.getElementById("nativeShareBtn");
      shareBtn.style.display = "flex";
      shareBtn.addEventListener("click", async () => {
        try {
          await navigator.share({
            title: "TimeSensei Temporal Capture",
            text: "Check out my temporal capture from TimeSensei: Control Your Timeline!",
            url: currentUrl
          });
        } catch (err) {
          console.log("Share cancelled or failed");
        }
      });
    }
  </script>
</body>
</html>
