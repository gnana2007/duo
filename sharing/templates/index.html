<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mirror World - Your Memory</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: rgba(26, 31, 46, 0.85);
      --accent: #00f2fe;
      --accent-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --whatsapp: #25D366;
      --text: #f0f4f8;
      --text-muted: #8e9bb0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1e2840 0%, #0b0d14 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
      border: 1px solid rgba(0, 242, 254, 0.3);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .photo-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      margin-bottom: 24px;
    }
    .img-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .photo-info {
      font-size: 13px;
      color: var(--text-muted);
    }
    .photo-info strong {
      display: block;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 2px;
    }
    .actions {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-download {
      background: var(--accent-grad);
      color: #03101c;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.35);
    }
    .btn-whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
    }
    .btn-share {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Interactive Mirror World</div>
    <h1>Your Virtual Photo</h1>
    <p class="subtitle">Captured live inside the virtual environment</p>
  </div>

  <div class="photo-card">
    <div class="img-container">
      <img src="/image/{{ photo_id }}" alt="Mirror World Photo" id="photoImg">
    </div>
    <div class="card-body">
      <div class="photo-info">
        <strong>Studio Portrait</strong>
        <span>{{ photo_id }}</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <!-- Download Button -->
    <a href="/download/{{ photo_id }}" class="btn btn-download" download>
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Save Photo to Phone
    </a>

    <!-- Share to WhatsApp Button -->
    <button class="btn btn-whatsapp" onclick="shareWhatsApp()">
      <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 15 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67Z"/></svg>
      Share to WhatsApp
    </button>

    <!-- Native Mobile Web Share -->
    <button class="btn btn-share" onclick="nativeShare()">
      <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
      More Sharing Options
    </button>
  </div>

  <div class="footer">
    Interactive Mirror World &copy; 2026
  </div>

  <script>
    const photoUrl = window.location.href;
    const downloadUrl = window.location.origin + '/download/{{ photo_id }}';

    function shareWhatsApp() {
      const text = encodeURIComponent("Check out my photo from the Interactive Mirror World! " + photoUrl);
      window.location.href = "whatsapp://send?text=" + text;
      // Fallback web WhatsApp if app is not installed
      setTimeout(() => {
        window.open("https://api.whatsapp.com/send?text=" + text, "_blank");
      }, 500);
    }

    async function nativeShare() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: "My Mirror World Photo",
            text: "Look at my virtual world photo!",
            url: photoUrl
          });
        } catch (err) {
          console.log("Share dismissed or failed", err);
        }
      } else {
        navigator.clipboard.writeText(photoUrl);
        alert("Link copied to clipboard!");
      }
    }
  </script>
</body>
</html>
